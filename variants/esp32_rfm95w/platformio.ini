[ESP32_RFM95W]
extends = esp32_base
board = esp32dev
board_build.partitions = min_spiffs.csv

build_flags =
    ${esp32_base.build_flags}
    -I variants/esp32_rfm95w
    -D P_LORA_DIO_0=26
    -D P_LORA_DIO_1=33
    -D P_LORA_NSS=5
    -D P_LORA_RESET=14
    -D P_LORA_SCLK=18
    -D P_LORA_MISO=19
    -D P_LORA_MOSI=23
    -D SX127X_CURRENT_LIMIT=120
    -D RADIO_CLASS=CustomSX1276
    -D WRAPPER_CLASS=CustomSX1276Wrapper
    -D LORA_TX_POWER=17

build_src_filter =
    ${esp32_base.build_src_filter}
    +<../variants/esp32_rfm95w>
    +<helpers/sensors>

lib_deps = ${esp32_base.lib_deps}

[env:esp32_rfm95w_companion_radio_ble]
extends = ESP32_RFM95W
board_build.upload.maximum_ram_size = 2000000

build_flags =
    ${ESP32_RFM95W.build_flags}
    -D MAX_CONTACTS=100
    -D MAX_GROUP_CHANNELS=20
    -D BLE_PIN_CODE=123456
    -D OFFLINE_QUEUE_SIZE=64

build_src_filter =
    ${ESP32_RFM95W.build_src_filter}
    +<helpers/esp32/*.cpp>
    +<../examples/companion_radio/*.cpp>

lib_deps =
    ${ESP32_RFM95W.lib_deps}
    densaugeo/base64 @ ~1.4.0
